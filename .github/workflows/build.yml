name: Build iGameGod Vibrate Tweak Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install ldid dpkg make zip

      - name: Setup Theos env
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      # ========== 编译deb 纯Tweak项目 ==========
      - name: Build deb package
        run: |
          make clean
          make package FINALPACKAGE=1

      # ========== 上传产物 deb ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iGameGodVibrate-Build
          path: ./packages/*.deb
          retention-days: 30